<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>📖 百字识字 · 语音闯关</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* 安卓平板专用优化 */
        body {
            background: linear-gradient(135deg, #1a472a 0%, #0d2b1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Roboto', 'Noto Sans CJK SC', 'Droid Sans Fallback', system-ui, -apple-system, sans-serif;
            padding: 20px;
        }

        .container {
            background: #fffef7;
            border-radius: 48px;
            max-width: 700px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }

        /* 头部 */
        .header {
            background: #ffb347;
            padding: 20px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .score-box, .progress-box {
            background: #2c2b26;
            padding: 10px 24px;
            border-radius: 60px;
            color: #ffd966;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .score-box span, .progress-box span {
            color: white;
            font-size: 1.8rem;
            font-weight: 800;
            margin-right: 8px;
        }

        /* 汉字区域 - 平板大字体 */
        .word-container {
            background: #faf3e0;
            margin: 30px 25px;
            border-radius: 56px;
            padding: 50px 20px;
            text-align: center;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.05), 0 12px 28px rgba(0,0,0,0.12);
        }

        .character {
            font-size: 160px;
            font-weight: 900;
            color: #2d5016;
            font-family: 'Noto Sans CJK SC', 'Roboto', 'Droid Sans Fallback', 'PingFang SC', 'Microsoft YaHei', serif;
            text-shadow: 4px 4px 12px rgba(0,0,0,0.1);
            line-height: 1.2;
            letter-spacing: 8px;
            background: #fff8f0;
            padding: 30px 20px;
            border-radius: 48px;
            display: inline-block;
            width: 100%;
        }

        /* 信息面板 */
        .info-area {
            background: #f0edd5;
            margin: 10px 25px;
            padding: 18px 20px;
            border-radius: 48px;
            text-align: center;
        }

        .mic-badge {
            display: inline-block;
            padding: 8px 20px;
            background: #e8e0c8;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #5a4a2a;
            margin-bottom: 10px;
        }

        .message {
            font-size: 1rem;
            color: #5a6e3a;
            line-height: 1.5;
        }

        /* 按钮 - 适合手指点击的大按钮 */
        .button-bar {
            display: flex;
            gap: 20px;
            padding: 20px 25px 35px;
        }

        .btn {
            flex: 1;
            padding: 18px 12px;
            border: none;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s ease;
            font-family: inherit;
            letter-spacing: 2px;
        }

        .btn-speak {
            background: #ff9f4a;
            color: white;
            box-shadow: 0 5px 0 #c96f1e;
        }

        .btn-reset {
            background: #cdd9c7;
            color: #3a5230;
            box-shadow: 0 5px 0 #9bae8c;
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        .btn:disabled {
            opacity: 0.5;
            transform: none;
        }

        /* 录音动画 */
        .recording {
            background: #ff5722 !important;
            animation: recordingPulse 0.8s infinite;
        }

        @keyframes recordingPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; background: #e64a19; }
        }

        /* 反馈动画 */
        .correct-effect {
            background: #c8e6b5 !important;
            transition: 0.15s;
        }

        .wrong-effect {
            transform: scale(0.95);
        }

        /* 平板横屏适配 */
        @media (min-width: 800px) and (orientation: landscape) {
            .character { font-size: 140px; }
            .word-container { padding: 40px 20px; }
            .btn { padding: 16px; font-size: 1.1rem; }
        }

        /* 手机竖屏 */
        @media (max-width: 600px) {
            .character { font-size: 80px; padding: 20px; }
            .word-container { padding: 30px 15px; margin: 20px; }
            .btn { padding: 14px; font-size: 1rem; }
            .score-box span, .progress-box span { font-size: 1.4rem; }
        }

        /* 小手机 */
        @media (max-width: 400px) {
            .character { font-size: 60px; }
            .header { padding: 15px 20px; }
        }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 11px;
            color: #a7b89e;
            background: #fffef7;
            border-top: 1px solid #efe3cd;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="score-box">🏆 得分 <span id="scoreDisplay">0</span></div>
        <div class="progress-box">📖 进度 <span id="progressDisplay">0</span>/<span id="totalDisplay">100</span></div>
    </div>

    <div class="word-container">
        <div class="character" id="currentChar">一</div>
    </div>

    <div class="info-area" id="infoArea">
        <div class="mic-badge" id="micStatus">🎙️ 准备就绪</div>
        <div class="message" id="tipMessage">👇 点击下方橙色按钮，大声朗读汉字</div>
    </div>

    <div class="button-bar">
        <button class="btn btn-speak" id="speakButton">🎤 朗读</button>
        <button class="btn btn-reset" id="resetButton">🔄 重来</button>
    </div>
    <footer>📢 大声朗读 → 自动识别 → 正确得分 → 进入下一字</footer>
</div>

<script>
    // ==================== 100个生字库 ====================
    const CHARACTER_LIBRARY = [
        "一", "二", "三", "四", "五", "六", "七", "八", "九", "十",
        "人", "口", "手", "足", "耳", "目", "日", "月", "水", "火",
        "山", "石", "田", "土", "木", "林", "森", "云", "风", "雨",
        "电", "天", "地", "爸", "妈", "哥", "姐", "弟", "妹", "爷",
        "奶", "大", "小", "多", "少", "上", "下", "左", "右", "前",
        "后", "来", "去", "走", "跑", "跳", "笑", "哭", "吃", "喝",
        "唱", "画", "写", "读", "书", "笔", "纸", "桌", "椅", "门",
        "窗", "花", "草", "树", "叶", "红", "绿", "黄", "蓝", "白",
        "黑", "猫", "狗", "鸟", "鱼", "虫", "牛", "羊", "马", "兔",
        "星", "光", "亮", "明", "暗", "香", "甜", "苦", "乐", "喜"
    ];
    
    const TOTAL_COUNT = CHARACTER_LIBRARY.length;
    document.getElementById('totalDisplay').innerText = TOTAL_COUNT;
    
    // 游戏状态
    let currentIdx = 0;          // 当前第几个 (0-99)
    let currentScore = 0;        // 当前得分
    let speechRecognition = null;
    let isRecognizingActive = false;
    
    // DOM 元素
    const charElement = document.getElementById('currentChar');
    const scoreElement = document.getElementById('scoreDisplay');
    const progressElement = document.getElementById('progressDisplay');
    const speakBtn = document.getElementById('speakButton');
    const resetBtn = document.getElementById('resetButton');
    const micStatusSpan = document.getElementById('micStatus');
    const tipSpan = document.getElementById('tipMessage');
    const infoArea = document.getElementById('infoArea');
    
    // ========== 更新界面 ==========
    function updateGameUI() {
        scoreElement.innerText = currentScore;
        progressElement.innerText = currentIdx;
        
        if (currentIdx < TOTAL_COUNT) {
            charElement.innerText = CHARACTER_LIBRARY[currentIdx];
            charElement.style.fontSize = '';
        } else {
            charElement.innerText = '🎉🏆🎉';
            charElement.style.fontSize = '80px';
        }
    }
    
    // 显示提示（无弹窗）
    function showTipMessage(msg, isError = false) {
        tipSpan.innerText = msg;
        tipSpan.style.color = isError ? '#d9534f' : '#5a6e3a';
        // 3秒后恢复默认提示（如果不是错误状态且游戏未结束）
        if (!isError && currentIdx < TOTAL_COUNT) {
            setTimeout(() => {
                if (tipSpan.innerText === msg && currentIdx < TOTAL_COUNT && !isRecognizingActive) {
                    tipSpan.innerText = '🎤 点击「朗读」按钮继续挑战';
                    tipSpan.style.color = '#5a6e3a';
                }
            }, 2000);
        }
    }
    
    function setMicStatusText(text, isActive = false) {
        micStatusSpan.innerText = text;
        micStatusSpan.style.background = isActive ? '#ffd699' : '#e8e0c8';
    }
    
    // ========== 正确得分处理 ==========
    function handleCorrectAnswer() {
        if (currentIdx >= TOTAL_COUNT) return;
        
        // 加分并前进
        currentScore++;
        currentIdx++;
        updateGameUI();
        
        // 正确反馈效果
        infoArea.classList.add('correct-effect');
        setTimeout(() => infoArea.classList.remove('correct-effect'), 300);
        showTipMessage('✅ 读音正确！ +1分 进入下一字', false);
        setMicStatusText('🎉 正确！');
        
        // 通关检测
        if (currentIdx === TOTAL_COUNT) {
            showTipMessage(`🏆 恭喜通关！ 得分 ${currentScore}/${TOTAL_COUNT} 🏆`, false);
            setMicStatusText('🏆 通关完成');
            speakBtn.disabled = true;
            if (speechRecognition && isRecognizingActive) {
                try { speechRecognition.stop(); } catch(e) {}
                isRecognizingActive = false;
            }
            speakBtn.classList.remove('recording');
            return;
        }
        
        // 停止当前识别，让用户重新点击按钮
        if (speechRecognition && isRecognizingActive) {
            try { speechRecognition.stop(); } catch(e) {}
            isRecognizingActive = false;
            speakBtn.classList.remove('recording');
        }
        
        // 延迟恢复提示
        setTimeout(() => {
            if (currentIdx < TOTAL_COUNT && !isRecognizingActive) {
                setMicStatusText('🎙️ 就绪');
                tipSpan.innerText = '🎤 点击「朗读」继续';
                tipSpan.style.color = '#5a6e3a';
            }
        }, 1200);
    }
    
    // ========== 语音识别初始化（安卓优化） ==========
    function initSpeechForAndroid() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            showTipMessage('❌ 当前浏览器不支持语音识别，请使用Chrome浏览器', true);
            speakBtn.disabled = true;
            return false;
        }
        
        const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
        speechRecognition = new SpeechRecognitionAPI();
        
        // 安卓优化配置
        speechRecognition.continuous = false;      // 单次识别
        speechRecognition.interimResults = false;  // 只取最终结果
        speechRecognition.lang = 'zh-CN';          // 中文普通话
        speechRecognition.maxAlternatives = 1;
        
        // 开始识别
        speechRecognition.onstart = () => {
            isRecognizingActive = true;
            speakBtn.classList.add('recording');
            setMicStatusText('🎤 聆听中... 请朗读', true);
            showTipMessage('🗣️ 大声朗读上面的汉字', false);
        };
        
        // 识别错误（静默处理）
        speechRecognition.onerror = (event) => {
            console.log('识别错误:', event.error);
            isRecognizingActive = false;
            speakBtn.classList.remove('recording');
            
            if (currentIdx >= TOTAL_COUNT) return;
            
            let errorMsg = '';
            if (event.error === 'not-allowed') {
                errorMsg = '🎤 需要麦克风权限，请在弹窗中点击「允许」';
                setMicStatusText('🔇 需要授权');
            } else if (event.error === 'no-speech') {
                errorMsg = '没有听到声音，请重试';
                setMicStatusText('🎙️ 未检测到声音');
            } else {
                errorMsg = '识别失败，请再试一次';
                setMicStatusText('🎙️ 重试');
            }
            showTipMessage(errorMsg, true);
            
            // 3秒后恢复按钮状态
            setTimeout(() => {
                if (!isRecognizingActive && currentIdx < TOTAL_COUNT) {
                    setMicStatusText('🎙️ 点击朗读');
                }
            }, 2000);
        };
        
        // 识别结束
        speechRecognition.onend = () => {
            speakBtn.classList.remove('recording');
            isRecognizingActive = false;
            if (currentIdx < TOTAL_COUNT && !speakBtn.disabled) {
                setMicStatusText('🎙️ 点击朗读');
            }
        };
        
        // 识别结果
        speechRecognition.onresult = (event) => {
            const resultText = event.results[0][0].transcript;
            const targetChar = CHARACTER_LIBRARY[currentIdx];
            
            // 提取第一个汉字
            const chineseMatch = resultText.match(/[\u4e00-\u9fa5]/);
            const spokenChar = chineseMatch ? chineseMatch[0] : '';
            
            if (spokenChar === targetChar) {
                handleCorrectAnswer();
            } else {
                // 错误反馈
                showTipMessage(`❌ 读音「${spokenChar || resultText}」≠「${targetChar}」, 再试试`, true);
                setMicStatusText('🔁 读音不对');
                
                // 汉字抖动效果
                charElement.classList.add('wrong-effect');
                setTimeout(() => charElement.classList.remove('wrong-effect'), 200);
                
                // 停止本次识别
                if (speechRecognition && isRecognizingActive) {
                    try { speechRecognition.stop(); } catch(e) {}
                    isRecognizingActive = false;
                    speakBtn.classList.remove('recording');
                }
                
                // 恢复按钮
                setTimeout(() => {
                    if (!isRecognizingActive && currentIdx < TOTAL_COUNT) {
                        setMicStatusText('🎙️ 再试一次');
                    }
                }, 1000);
            }
        };
        
        return true;
    }
    
    // ========== 开始朗读（用户点击触发） ==========
    function startSpeechRecognition() {
        // 游戏结束检查
        if (currentIdx >= TOTAL_COUNT) {
            showTipMessage('🎯 已完成全部汉字，点击「重来」继续挑战', false);
            return;
        }
        
        // 初始化识别器
        if (!speechRecognition) {
            if (!initSpeechForAndroid()) return;
        }
        
        // 如果正在识别，先停止
        if (isRecognizingActive) {
            try { speechRecognition.stop(); } catch(e) {}
            setTimeout(() => startSpeechRecognition(), 200);
            return;
        }
        
        // 开始识别（浏览器会自动弹出权限请求，仅首次）
        try {
            speechRecognition.start();
        } catch(err) {
            console.warn(err);
            setMicStatusText('🎤 等待授权');
            showTipMessage('⚠️ 请在弹出的权限窗口中点击「允许」', true);
        }
    }
    
    // ========== 重置游戏 ==========
    function resetGame() {
        // 停止识别
        if (speechRecognition && isRecognizingActive) {
            try { speechRecognition.stop(); } catch(e) {}
            isRecognizingActive = false;
        }
        
        // 重置状态
        currentIdx = 0;
        currentScore = 0;
        updateGameUI();
        
        // 恢复按钮
        speakBtn.disabled = false;
        speakBtn.classList.remove('recording');
        
        // 重置提示
        setMicStatusText('🎙️ 重新开始');
        showTipMessage('✨ 已重置，点击「朗读」开始挑战', false);
        
        // 2秒后恢复
        setTimeout(() => {
            if (currentIdx < TOTAL_COUNT && !isRecognizingActive) {
                setMicStatusText('🎙️ 点击朗读');
                tipSpan.innerText = '👇 点击橙色按钮，大声朗读汉字';
                tipSpan.style.color = '#5a6e3a';
            }
        }, 1500);
    }
    
    // ========== 绑定事件 ==========
    speakBtn.addEventListener('click', startSpeechRecognition);
    resetBtn.addEventListener('click', resetGame);
    
    // ========== 初始化 ==========
    updateGameUI();
    initSpeechForAndroid();
    
    // 友好的初始提示
    setTimeout(() => {
        if (currentIdx === 0) {
            tipSpan.innerText = '🎤 点击「朗读」按钮 → 允许麦克风 → 大声读汉字';
            setMicStatusText('🎙️ 准备就绪');
        }
    }, 500);
    
    // 安卓平板额外优化：防止长按菜单
    document.querySelectorAll('.btn').forEach(btn => {
        btn.addEventListener('contextmenu', (e) => e.preventDefault());
        btn.addEventListener('touchstart', () => {});
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>📖 百字识字 · 语音闯关</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #1a472a 0%, #0d2b1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans CJK SC', system-ui, sans-serif;
            padding: 16px;
        }

        .game-card {
            background: #fffef7;
            border-radius: 48px;
            max-width: 700px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }

        .header {
            background: #ffb347;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .score, .progress {
            background: #2c2b26;
            padding: 8px 20px;
            border-radius: 40px;
            color: #ffd966;
            font-weight: bold;
        }

        .score span, .progress span {
            color: white;
            font-size: 1.6rem;
            font-weight: 800;
            margin-right: 6px;
        }

        .word-area {
            background: #faf3e0;
            margin: 30px 20px;
            border-radius: 48px;
            padding: 50px 20px;
            text-align: center;
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .word {
            font-size: 140px;
            font-weight: 900;
            color: #2d5016;
            font-family: 'Noto Sans CJK SC', 'Segoe UI', 'Roboto', sans-serif;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.1);
            background: #fff8f0;
            padding: 25px;
            border-radius: 40px;
            display: inline-block;
            width: 100%;
        }

        .info-card {
            background: #f0edd5;
            margin: 10px 20px;
            padding: 16px;
            border-radius: 40px;
            text-align: center;
        }

        .mic-status {
            display: inline-block;
            padding: 6px 18px;
            background: #e8e0c8;
            border-radius: 30px;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .hint {
            font-size: 0.95rem;
            color: #5a6e3a;
        }

        .buttons {
            display: flex;
            gap: 16px;
            padding: 16px 20px 30px;
        }

        button {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-speak {
            background: #ff9f4a;
            color: white;
            box-shadow: 0 4px 0 #c96f1e;
        }

        .btn-reset {
            background: #cdd9c7;
            color: #3a5230;
            box-shadow: 0 4px 0 #9bae8c;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .listening {
            background: #ff5722 !important;
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .correct-flash {
            background: #c8e6b5 !important;
        }

        @media (max-width: 600px) {
            .word { font-size: 80px; padding: 15px; }
            .word-area { padding: 30px 15px; }
        }

        footer {
            text-align: center;
            padding: 12px;
            font-size: 11px;
            color: #a7b89e;
            border-top: 1px solid #efe3cd;
        }
    </style>
</head>
<body>
<div class="game-card">
    <div class="header">
        <div class="score">🏆 得分 <span id="scoreVal">0</span></div>
        <div class="progress">📖 进度 <span id="progressVal">0</span>/<span id="totalVal">100</span></div>
    </div>

    <div class="word-area">
        <div class="word" id="character">一</div>
    </div>

    <div class="info-card" id="infoCard">
        <div class="mic-status" id="micStatus">🎙️ 准备</div>
        <div class="hint" id="hintMsg">👇 点击橙色按钮，大声朗读</div>
    </div>

    <div class="buttons">
        <button class="btn-speak" id="speakBtn">🎤 朗读</button>
        <button class="btn-reset" id="resetBtn">🔄 重置</button>
    </div>
    <footer>📢 提示：Edge浏览器需要点击两次按钮才能启动麦克风</footer>
</div>

<script>
    // 100个汉字
    const WORDS = "一 二 三 四 五 六 七 八 九 十 人 口 手 足 耳 目 日 月 水 火 山 石 田 土 木 林 森 云 风 雨 电 天 地 爸 妈 哥 姐 弟 妹 爷 奶 大 小 多 少 上 下 左 右 前 后 来 去 走 跑 跳 笑 哭 吃 喝 唱 画 写 读 书 笔 纸 桌 椅 门 窗 花 草 树 叶 红 绿 黄 蓝 白 黑 猫 狗 鸟 鱼 虫 牛 羊 马 兔 星 光 亮 明 暗 香 甜 苦 乐 喜".split(" ");
    
    const TOTAL = WORDS.length;
    document.getElementById('totalVal').innerText = TOTAL;
    
    let idx = 0, score = 0;
    let recognition = null;
    let isActive = false;
    let edgeRetryCount = 0;
    
    const charEl = document.getElementById('character');
    const scoreEl = document.getElementById('scoreVal');
    const progressEl = document.getElementById('progressVal');
    const speakBtn = document.getElementById('speakBtn');
    const resetBtn = document.getElementById('resetBtn');
    const micStatus = document.getElementById('micStatus');
    const hintMsg = document.getElementById('hintMsg');
    const infoCard = document.getElementById('infoCard');
    
    function updateDisplay() {
        scoreEl.innerText = score;
        progressEl.innerText = idx;
        if (idx < TOTAL) {
            charEl.innerText = WORDS[idx];
        } else {
            charEl.innerText = "🎉";
        }
    }
    
    function setMessage(msg, isError = false) {
        hintMsg.innerText = msg;
        hintMsg.style.color = isError ? '#c0392b' : '#5a6e3a';
    }
    
    function setMic(text) {
        micStatus.innerText = text;
    }
    
    function correctAndNext() {
        if (idx >= TOTAL) return;
        score++;
        idx++;
        updateDisplay();
        
        infoCard.classList.add('correct-flash');
        setTimeout(() => infoCard.classList.remove('correct-flash'), 300);
        setMessage('✅ 正确！ +1分');
        setMic('🎉 正确');
        
        if (idx === TOTAL) {
            setMessage(`🏆 通关！ ${score}/${TOTAL} 分 🏆`);
            setMic('🏆 完成');
            speakBtn.disabled = true;
            if (recognition && isActive) {
                try { recognition.stop(); } catch(e) {}
                isActive = false;
            }
            speakBtn.classList.remove('listening');
            return;
        }
        
        if (recognition && isActive) {
            try { recognition.stop(); } catch(e) {}
            isActive = false;
            speakBtn.classList.remove('listening');
        }
        
        setTimeout(() => {
            if (idx < TOTAL && !isActive) {
                setMessage('🎤 点击「朗读」继续');
                setMic('🎙️ 就绪');
            }
        }, 1000);
    }
    
    // Edge专用语音初始化
    function initEdgeSpeech() {
        // Edge支持 webkitSpeechRecognition
        const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognitionAPI) {
            setMessage('❌ 浏览器不支持语音识别，请安装Chrome浏览器', true);
            speakBtn.disabled = true;
            return false;
        }
        
        try {
            recognition = new SpeechRecognitionAPI();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'zh-CN';
            
            recognition.onstart = () => {
                isActive = true;
                speakBtn.classList.add('listening');
                setMic('🎤 聆听中...');
                setMessage('🗣️ 大声朗读上面的汉字');
                edgeRetryCount = 0;
            };
            
            recognition.onerror = (e) => {
                console.log('Edge错误:', e.error);
                isActive = false;
                speakBtn.classList.remove('listening');
                
                if (e.error === 'not-allowed') {
                    setMic('🔇 需要授权');
                    setMessage('请点击「允许」使用麦克风', true);
                } else if (e.error === 'no-speech') {
                    setMic('🎙️ 未听到');
                    setMessage('没有听到声音，再试一次', true);
                } else {
                    setMic('⚠️ 重试');
                    setMessage('识别失败，请重试', true);
                }
                
                // Edge特殊处理：有时需要重试
                setTimeout(() => {
                    if (!isActive && idx < TOTAL) {
                        setMic('🎙️ 点击重试');
                    }
                }, 1500);
            };
            
            recognition.onend = () => {
                speakBtn.classList.remove('listening');
                isActive = false;
                if (idx < TOTAL && !speakBtn.disabled) {
                    setMic('🎙️ 点击朗读');
                }
            };
            
            recognition.onresult = (e) => {
                const spoken = e.results[0][0].transcript;
                const target = WORDS[idx];
                const chnMatch = spoken.match(/[\u4e00-\u9fa5]/);
                const spokenChar = chnMatch ? chnMatch[0] : '';
                
                if (spokenChar === target) {
                    correctAndNext();
                } else {
                    setMessage(`❌ 「${spokenChar || spoken}」≠「${target}」`, true);
                    setMic('🔁 不对');
                    charEl.style.transform = 'scale(0.95)';
                    setTimeout(() => { charEl.style.transform = ''; }, 200);
                    
                    if (recognition && isActive) {
                        try { recognition.stop(); } catch(e) {}
                        isActive = false;
                        speakBtn.classList.remove('listening');
                    }
                    
                    setTimeout(() => {
                        if (!isActive && idx < TOTAL) {
                            setMic('🎙️ 再试一次');
                        }
                    }, 1000);
                }
            };
            
            return true;
        } catch(e) {
            console.error(e);
            setMessage('初始化失败，请刷新页面', true);
            return false;
        }
    }
    
    // 开始识别（Edge适配）
    function startListening() {
        if (idx >= TOTAL) {
            setMessage('已完成，点击重置继续');
            return;
        }
        
        if (!recognition) {
            if (!initEdgeSpeech()) return;
        }
        
        if (isActive) {
            try { recognition.stop(); } catch(e) {}
            setTimeout(() => startListening(), 200);
            return;
        }
        
        try {
            recognition.start();
        } catch(err) {
            console.warn(err);
            setMic('🎤 等待授权');
            setMessage('请在弹出的窗口点击「允许」', true);
            // Edge可能需要重建实例
            recognition = null;
            setTimeout(() => {
                if (!recognition && idx < TOTAL) {
                    initEdgeSpeech();
                }
            }, 500);
        }
    }
    
    function resetGame() {
        if (recognition && isActive) {
            try { recognition.stop(); } catch(e) {}
            isActive = false;
        }
        idx = 0;
        score = 0;
        updateDisplay();
        speakBtn.disabled = false;
        speakBtn.classList.remove('listening');
        setMessage('✨ 已重置，点击「朗读」开始');
        setMic('🎙️ 重新开始');
    }
    
    speakBtn.onclick = startListening;
    resetBtn.onclick = resetGame;
    
    updateDisplay();
    initEdgeSpeech();
    
    // Edge特殊提示
    setTimeout(() => {
        setMessage('🔊 点击「朗读」→ 允许麦克风 → 大声读字', false);
    }, 500);
</script>
</body>
</html>
